<!DOCTYPE html>
<html>
<head>
    <title>Fast QA Test Sandbox</title>
    <style>
        body { font-family: sans-serif; background: #121214; color: #fff; padding: 20px; text-align: center; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 4px; border: 1px solid #444; }
        input { background: #222; color: #fff; }
        button { background: #7c3aed; color: #fff; cursor: pointer; }
        #results { margin-top: 20px; font-size: 18px; color: #34d399; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Local Automated Testing Sandbox</h2>
    <input type="text" id="search-input" placeholder="Type search term...">
    <button id="search-btn" onclick="performSearch()">Search</button>
    <div id="results"></div>

    <script>
        // Track the run attempt in sessionStorage (persists across page reloads in same browser session)
        let attempts = parseInt(sessionStorage.getItem('attempts') || '0') + 1;
        sessionStorage.setItem('attempts', attempts);

        function performSearch() {
            const inputVal = document.getElementById('search-input').value;
            document.getElementById('results').innerText = "";
            
            // On attempt 1, delay results so instant assertion fails.
            // On attempt 2+, render instantly so assertion passes.
            if (attempts === 1) {
                setTimeout(() => {
                    document.getElementById('results').innerText = "Results for " + inputVal;
                }, 1500);
            } else {
                document.getElementById('results').innerText = "Results for " + inputVal;
            }
        }
    </script>
</body>
</html>
