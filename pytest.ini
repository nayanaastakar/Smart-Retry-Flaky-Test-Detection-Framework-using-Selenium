[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: quick, high-confidence tests suitable for every commit
    regression: full regression coverage
    login: authentication flows
    cart: shopping cart flows
    checkout: checkout flows
    negative: negative-path / error-handling tests

addopts =
    -ra
    --strict-markers
    --tb=short

log_cli = true
log_cli_level = INFO
